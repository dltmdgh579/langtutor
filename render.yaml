# Render Blueprint: Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면
# 아래 설정으로 웹 서비스가 만들어집니다. sync: false 항목은 생성할 때 직접 입력합니다.
services:
  - type: web
    name: langtutor
    runtime: node
    plan: free
    region: singapore
    branch: main
    # 배포에 필요 없는 요청(보안 검사·npm 버전 확인)을 빼고, 멈춘 요청은 기본 5분 대신
    # 30초 만에 재시도합니다. --loglevel=http 로 요청별 소요 시간이 빌드 로그에 남습니다.
    buildCommand: npm ci --no-audit --no-fund --no-update-notifier --fetch-timeout=30000 --loglevel=http
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VOICE_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MAX_CALL_MINUTES
        value: "10"
